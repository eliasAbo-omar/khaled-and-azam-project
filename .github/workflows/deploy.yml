name: Deploy Dist to GitHub Pages

on:
  push:
    branches: ["master"] # إذا كان اسم فرعك في GitHub هو master استبدل main بـ master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # توجيه السيرفر لقراءة ما بداخل مجلد dist مباشرة
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
